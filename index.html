<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — To-do</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-muted: #f0f1f4;
      --text: #1b1d24;
      --muted: #747987;
      --line: #e4e6eb;
      --accent: #6558d3;
      --accent-strong: #5347c2;
      --success: #3b9a6d;
      --danger: #c95757;
      --shadow: 0 18px 45px rgba(30, 35, 50, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181d;
        --surface: #22242b;
        --surface-muted: #2b2d35;
        --text: #f3f4f7;
        --muted: #9a9daa;
        --line: #383a44;
        --accent: #9186f1;
        --accent-strong: #a49af7;
        --success: #62c390;
        --danger: #ed8585;
        --shadow: 0 18px 45px rgba(0, 0, 0, .2);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 52px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    main { width: min(100%, 480px); margin: 0 auto; }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 36px); letter-spacing: -.045em; line-height: 1.1; }
    .intro { margin: 10px 0 28px; color: var(--muted); }

    .composer {
      display: flex;
      gap: 10px;
      padding: 7px;
      margin-bottom: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: var(--shadow);
    }
    input[type="text"] {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    .add-button {
      padding: 0 17px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      transition: background .2s ease, transform .2s ease;
    }
    .add-button:hover { background: var(--accent-strong); }
    .add-button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 3px 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .task-list { display: grid; gap: 9px; }
    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 5px 18px rgba(30, 35, 50, .035);
      animation: slide-in .32s ease both;
    }
    .task.removing { animation: slide-out .2s ease forwards; }
    .check {
      display: grid;
      flex: 0 0 21px;
      width: 21px;
      height: 21px;
      place-items: center;
      padding: 0;
      border: 1.5px solid var(--muted);
      border-radius: 50%;
      background: transparent;
      color: #fff;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .check:hover { border-color: var(--accent); transform: scale(1.08); }
    .check svg { width: 13px; height: 13px; opacity: 0; transform: scale(.4); transition: opacity .2s ease, transform .2s ease; }
    .task.completed .check { border-color: var(--success); background: var(--success); }
    .task.completed .check svg { opacity: 1; transform: scale(1); }
    .task-title { flex: 1; min-width: 0; overflow-wrap: anywhere; transition: color .2s ease, opacity .2s ease; }
    .task.completed .task-title { color: var(--muted); opacity: .75; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .delete {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      opacity: .55;
      transition: color .2s ease, background .2s ease, opacity .2s ease;
    }
    .delete:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); opacity: 1; }
    .empty { padding: 28px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @keyframes slide-in { from { opacity: 0; transform: translateY(-7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slide-out { to { opacity: 0; transform: translateX(10px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little progress</p>
    <h1>Today’s to-do</h1>
    <p class="intro">Keep the important things moving, one check at a time.</p>

    <form class="composer" id="todo-form">
      <label class="sr-only" for="todo-input">New task</label>
      <input id="todo-input" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off">
      <button class="add-button" type="submit">Add task</button>
    </form>

    <div class="list-header">
      <span id="task-count">0 tasks</span>
      <span id="progress-label">0% complete</span>
    </div>
    <section class="task-list" id="task-list" aria-live="polite"></section>
  </main>

  <script>
    const STORAGE_KEY = "today-todos";
    const examples = [
      { id: crypto.randomUUID(), title: "Plan the week ahead", completed: false },
      { id: crypto.randomUUID(), title: "Drink a glass of water", completed: true },
      { id: crypto.randomUUID(), title: "Take a short walk", completed: false }
    ];
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || examples;
    const list = document.querySelector("#task-list");
    const form = document.querySelector("#todo-form");
    const input = document.querySelector("#todo-input");
    const count = document.querySelector("#task-count");
    const progress = document.querySelector("#progress-label");

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

    function updateSummary() {
      const done = tasks.filter(task => task.completed).length;
      count.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
      progress.textContent = `${tasks.length ? Math.round(done / tasks.length * 100) : 0}% complete`;
    }

    function createTaskElement(task, index) {
      const item = document.createElement("article");
      item.className = `task${task.completed ? " completed" : ""}`;
      item.style.animationDelay = `${Math.min(index * 35, 180)}ms`;
      item.dataset.id = task.id;

      const check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark incomplete" : "Mark complete");

      const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      icon.setAttribute("viewBox", "0 0 16 16");
      icon.setAttribute("fill", "none");
      icon.setAttribute("aria-hidden", "true");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "m3.2 8.3 3 3 6.6-6.6");
      path.setAttribute("stroke", "currentColor");
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      icon.append(path);
      check.append(icon);

      const title = document.createElement("span");
      title.className = "task-title";
      title.textContent = task.title;

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete";
      deleteButton.setAttribute("aria-label", `Delete ${task.title}`);
      deleteButton.textContent = "×";

      item.append(check, title, deleteButton);
      return item;
    }

    function render() {
      const fragment = document.createDocumentFragment();

      if (!tasks.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nothing here yet — add a task to get started.";
        list.replaceChildren(empty);
      } else {
        tasks.forEach((task, index) => {
          fragment.appendChild(createTaskElement(task, index));
        });
        list.replaceChildren(fragment);
      }

      updateSummary();
    }

    list.addEventListener("click", event => {
      const checkButton = event.target.closest(".check");
      if (checkButton) {
        const item = checkButton.closest(".task");
        const task = tasks.find(({ id }) => id === item.dataset.id);
        if (!task) return;
        task.completed = !task.completed;
        save();
        render();
        return;
      }

      const deleteButton = event.target.closest(".delete");
      if (deleteButton) {
        const item = deleteButton.closest(".task");
        const taskId = item.dataset.id;
        item.classList.add("removing");
        setTimeout(() => {
          tasks = tasks.filter(({ id }) => id !== taskId);
          save();
          render();
        }, 200);
      }
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return input.focus();
      tasks.unshift({ id: crypto.randomUUID(), title, completed: false });
      save();
      input.value = "";
      render();
      input.focus();
    });

    render();
  </script>
</body>
</html>
